[project]
name = "rmbsq"
version = "0.0.0"
description = "Governed natural language queries over synthetic loan-level RMBS data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "pandas",
    "numpy",
    "pyarrow",
    "pydantic",
    "sqlglot",
    "rapidfuzz",
    "anthropic",
    "pyyaml",
    "matplotlib",
    "numpy-financial",
    "reportlab",
    "pypdf",
]

[project.scripts]
rmbsq = "rmbsq.cli:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-socket",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rmbsq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket -m \"not full\""
markers = [
    "full: reads or regenerates the full profile (instruction 01, O-5); run with pytest -m full",
]
